baseURL: "/"
languageCode: "en-us"
title: "Linguistic Indifference"
theme: "hugo-PaperMod"

# --- GLOBAL OUTPUTS ---
outputs:
  home:
    - HTML
    - RSS
    - JSON

# --- CRITICAL FOR TIMELINE ---
markup:
  goldmark:
    renderer:
      unsafe: true

# --- MENU SETTINGS ---
menu:
  main:
    - identifier: search
      name: "Search"
      url: "/search/"
      weight: 5   # This adds the icon/link to the top right
    - identifier: timeline
      name: "Timeline"
      url: "/timeline/"
      weight: 10
    - identifier: updates
      name: "Lab Notebook"
      url: "/archives/"
      weight: 20
        
# --- PAPERMOD SPECIFIC FEATURES ---        
params:
  comments: true
  comments_giscus:
    repo: "mathewkang2004/ling-website"
    repo_id: "R_kgDORCm1RA"
    category: "General"                  
    category_id: "DIC_kwDORCm1RM4C1gP-"      
    mapping: "pathname"
    strict: "0"
    reactions_enabled: "1"
    emit_metadata: "0"
    input_position: "bottom"
    theme: "transparent_dark"
    lang: "en"
  env: production # Forces PaperMod to act like it's "Live"
  mermaid: true
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false
  # ... your other params ...
  searchConfig:
    enabled: true
    url: "/search/"
  mainSections: ["posts"]
  hideHomePageList: true
  disableHomeInfo: true